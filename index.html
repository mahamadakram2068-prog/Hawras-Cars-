<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawras Cars - نرخەکانی نەقڵ</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #071728;
            --card-bg: #0d233a;
            --accent-yellow: #f5b000;
            --accent-hover: #ffd000;
            --text-white: #ffffff;
            --text-dim: #94a3b8;
            --border-color: #1e3a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 20px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
        }

        .logo-box {
            margin: 0 auto 15px;
            max-width: 260px;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(245, 176, 0, 0.15);
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .sub-title {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .contact-number {
            display: inline-block;
            margin-top: 10px;
            background: rgba(245, 176, 0, 0.1);
            color: var(--accent-yellow);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid var(--accent-yellow);
            direction: ltr;
        }

        .search-container {
            margin-bottom: 25px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-white);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px rgba(245, 176, 0, 0.2);
        }

        .table-responsive {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background-color: rgba(245, 176, 0, 0.15);
            color: var(--accent-yellow);
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.98rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .port-name {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .price-tag {
            color: var(--accent-yellow);
            font-weight: 900;
            font-size: 1.1rem;
            direction: ltr;
            display: inline-block;
        }

        .no-result {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            th, td {
                padding: 12px 10px;
                font-size: 0.88rem;
            }

            .price-tag {
                font-size: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-box">
            <img src="logo.jpg" alt="Hawras Cars Logo" id="main-logo" onerror="this.style.display='none'">
        </div>
        <h1>HAWRAS CARS</h1>
        <div class="sub-title">AUCTION USA - CANADA | IAAI & COPART</div>
        <div class="contact-number">📞 0771 011 3663</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 ناو یان کورتکراوەی شار بپشکنە..." oninput="filterData()">
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>شار / لق (Branch & City)</th>
                    <th>بەندەری مەقسەد (Destination)</th>
                    <th>کۆی نرخ (Total Cost)</th>
                </tr>
            </thead>
            <tbody id="shippingTable">
            </tbody>
        </table>
        <div id="noResults" class="no-result" style="display: none;">
            هیچ ئەنجامێک نەدۆزرایەوە!
        </div>
    </div>
</div>

<script>
    const shippingData = [
        { name: "IL - CHICAGO NORTH (Elgin)", port: "BALTIMORE, MD", price: "$1,729" },
        { name: "IL - CHICAGO WEST (Aurora)", port: "BALTIMORE, MD", price: "$1,729" },
        { name: "IL - WHEELING", port: "BALTIMORE, MD", price: "$1,704" },
        { name: "IL - PEORIA (PEKIN)", port: "BALTIMORE, MD", price: "$1,779" },
        { name: "IL - CHICAGO", port: "BALTIMORE, MD", price: "$1,704" },
        { name: "IL - Westchester", port: "BALTIMORE, MD", price: "$1,754" },
        { name: "IL - ST. LOUIS (Caseyville / Granite City)", port: "BALTIMORE, MD", price: "$1,729" },
        { name: "IL - BARTLETT", port: "BALTIMORE, MD", price: "$1,654" },
        { name: "IL - Matteson", port: "BALTIMORE, MD", price: "$1,804" },
        { name: "HI - MAUI / MAUI", port: "LOS ANGELES, CA", price: "$4,898" },
        { name: "HI - HONOLULU / Kapolei", port: "LOS ANGELES, CA", price: "$3,898" },
        { name: "WI - MADISON (MADISON)", port: "NEW JERSEY, NJ", price: "$1,550" },
        { name: "WV - SHADY SPRINGS", port: "NEW JERSEY, NJ", price: "$1,450" },
        { name: "WY - CASPER (Casper)", port: "LOS ANGELES, CA", price: "$3,173" },
        { name: "SD - SIOUX FALLS (LENNOX)", port: "HOUSTON, TX", price: "$2,424" },
        { name: "VA - Richmond (SANDSTON)", port: "NEW JERSEY, NJ", price: "$1,300" },
        { name: "WA - SEATTLE", port: "LOS ANGELES, CA", price: "$2,448" },
        { name: "TX - HOUSTON EAST", port: "HOUSTON, TX", price: "$1,324" }
    ];

    function renderTable(data) {
        const tableBody = document.getElementById("shippingTable");
        const noResults = document.getElementById("noResults");
        tableBody.innerHTML = "";

        if (data.length === 0) {
            noResults.style.display = "block";
            return;
        }

        noResults.style.display = "none";
        data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td><span class="port-name">🚢 ${item.port}</span></td>
                <td><span class="price-tag">${item.price}</span></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterData() {
        const rawInput = document.getElementById("searchInput").value.trim().toLowerCase();
        
        if (rawInput === "") {
            renderTable(shippingData);
            return;
        }

        // پاشکۆ و کورتکراوە بۆ گەڕانی کوردی یان لاتینی هەڵە
        let normalized = rawInput
            .replace(/چیکاهۆ|شیکاگو|چیکاگو/g, "chicago")
            .replace(/تێکساس/g, "texas")
            .replace(/مەیامی/g, "miami");

        const filtered = shippingData.filter(item => {
            const cityName = item.name.toLowerCase();
            
            // گەڕانی ڕاستەوخۆ یان پیت بە پیت
            return cityName.includes(normalized) || 
                   normalized.split(' ').every(word => cityName.includes(word));
        });

        renderTable(filtered);
    }

    renderTable(shippingData);
</script>

</body>
</html>
