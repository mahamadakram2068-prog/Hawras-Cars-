    function renderTable(data) {
        const tableBody = document.getElementById("shippingTable");
        const tableContainer = document.getElementById("tableContainer");
        const noResults = document.getElementById("noResults");
        
        tableBody.innerHTML = "";

        if (data.length === 0) {
            tableContainer.style.display = "none";
            noResults.style.display = "block";
            return;
        }

        noResults.style.display = "none";
        tableContainer.style.display = "block";

        data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td><span class="port-name">🚢 ${item.port}</span></td>
                <td><span class="price-tag">${item.price}</span></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterData() {
        const rawInput = document.getElementById("searchInput").value.trim().toLowerCase();
        const tableContainer = document.getElementById("tableContainer");
        const noResults = document.getElementById("noResults");
        
        if (rawInput === "") {
            tableContainer.style.display = "none";
            noResults.style.display = "none";
            return;
        }

        let searchTerm = rawInput
            .replace(/چیکاهۆ|شیکاگو|چیکاگو/g, "chicago")
            .replace(/تێکساس/g, "tx")
            .replace(/جۆرجیا/g, "ga")
            .replace(/فلۆریدا/g, "fl")
            .replace(/پێنسلڤانیا|پێنسلڤێنیا/g, "pa")
            .replace(/تێنسی/g, "tn")
            .replace(/مەیامی/g, "miami");

        const filtered = shippingData.filter(item => {
            const cityName = item.name.toLowerCase();
            return cityName.includes(searchTerm);
        });

        renderTable(filtered);
    }
