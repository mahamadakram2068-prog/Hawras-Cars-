<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>Hawras Cars - نرخەکانی نەقڵ</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #071728;
            --card-bg: #0d233a;
            --accent-yellow: #f5b000;
            --accent-hover: #ffd000;
            --text-white: #ffffff;
            --text-dim: #94a3b8;
            --border-color: #1e3a5f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 20px 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
        }

        .logo-box {
            margin: 0 auto 15px;
            max-width: 260px;
        }

        .logo-box img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(245, 176, 0, 0.15);
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .sub-title {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .contact-number {
            display: inline-block;
            margin-top: 10px;
            background: rgba(245, 176, 0, 0.1);
            color: var(--accent-yellow);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            border: 1px solid var(--accent-yellow);
            direction: ltr;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-white);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 15px rgba(245, 176, 0, 0.2);
        }

        .quick-filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0 15px;
            scrollbar-width: none;
        }

        .quick-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-white);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--accent-yellow);
            color: var(--bg-color);
            border-color: var(--accent-yellow);
        }

        .table-responsive {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th {
            background-color: rgba(245, 176, 0, 0.15);
            color: var(--accent-yellow);
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.98rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .port-name {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .price-tag {
            color: var(--accent-yellow);
            font-weight: 900;
            font-size: 1.1rem;
            direction: ltr;
            display: inline-block;
        }

        .no-result {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        @media (max-width: 600px) {
            th, td {
                padding: 12px 10px;
                font-size: 0.88rem;
            }

            .price-tag {
                font-size: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>

    function renderTable(data) {
        const tableBody = document.getElementById("shippingTable");
        const noResults = document.getElementById("noResults");
        tableBody.innerHTML = "";

        if (data.length === 0) {
            noResults.style.display = "block";
            return;
        }

        noResults.style.display = "none";
        data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td><span class="port-name">🚢 ${item.port}</span></td>
                <td><span class="price-tag">${item.price}</span></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterData() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const filtered = shippingData.filter(item => 
            item.name.toLowerCase().includes(query) || 
            item.port.toLowerCase().includes(query) ||
            item.state.toLowerCase() === query
        );
        renderTable(filtered);
    }

    function setQuickFilter(stateCode, event) {
        document.getElementById("searchInput").value = stateCode;
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if(event && event.target) {
            event.target.classList.add('active');
        }
        filterData();
    }

    renderTable(shippingData);
